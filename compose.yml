# compose.yml — Base configuration (SQLite, no external DB needed)

name: ${COMPOSE_PROJECT_NAME:-lingvo}

services:
  app:
    build:
      context: .
      target: production
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - lingvo_data:/data

volumes:
  lingvo_data:
